<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Rock Paper Scissors</h1>

  <button onclick="playGame('rock')" class="move-button"><img src="images/image-rock.png" class="move-icon" alt="Rock"></button>
  <button onclick="playGame('paper')" class="move-button"><img src="images/image-paper.png" class="move-icon" alt="Paper"></button>
  <button onclick="playGame('scissors')" class="move-button"><img src="images/image-scissors.png" class="move-icon" alt="Scissors"></button>
  <button onclick="
  score.wins = 0;
  score.losses = 0;
  score.ties = 0;
  localStorage.removeItem('score'); scoreUpdate(result); " class="move-button"><img src="images/image-reset.png" class="move-icon" alt="Reset Score"></button>
  <p id="moves"></p>
  <p id="result"></p>
  <p id="score"></p>

  <script src="script.js"></script>
</body>
</html>
